<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#8a4f2a"/>
  <!-- progress ring: faint track + 75% arc from the top, clockwise -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#a47659" stroke-width="26"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#fffdf9" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="801 1069" transform="rotate(-90 256 256)"/>
  <!-- closed Bible: spine, cover, cross -->
  <rect x="181" y="161" width="150" height="190" rx="14" fill="#e8cdb6"/>
  <rect x="195" y="161" width="136" height="190" rx="14" fill="#fffdf9"/>
  <rect x="255" y="200" width="16" height="112" fill="#8a4f2a"/>
  <rect x="229" y="232" width="68" height="16" fill="#8a4f2a"/>
</svg>
